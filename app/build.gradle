plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streamnest.iptv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.streamnest.iptv'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("STREAMNEST_KEYSTORE_FILE")
            if (ksFile != null && !ksFile.isEmpty()) {
                storeFile file(ksFile)
                storePassword System.getenv("STREAMNEST_KEYSTORE_PASSWORD")
                keyAlias System.getenv("STREAMNEST_KEY_ALIAS")
                keyPassword System.getenv("STREAMNEST_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
}
