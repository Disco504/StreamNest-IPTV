plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}

android {
    namespace 'com.streamnest.iptv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.streamnest.iptv'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }
}
