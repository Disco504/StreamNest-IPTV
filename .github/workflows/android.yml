cd ~/StreamNestIPTV
cat .github/workflows/android.ymlname: Build StreamNest IPTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.Release }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "ERROR: Release keystore secret is empty."
            exit 1
          }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/streamnest-release.jks"
          echo "STREAMNEST_KEYSTORE_FILE=$RUNNER_TEMP/streamnest-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STREAMNEST_KEYSTORE_PASSWORD: ${{ secrets.STREAMNEST_KEYSTORE_PASSWORD }}
          STREAMNEST_KEY_ALIAS: ${{ secrets.STREAMNEST_KEY_ALIAS }}
          STREAMNEST_KEY_PASSWORD: ${{ secrets.STREAMNEST_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamNest-IPTV-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
